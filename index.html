<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Buy Me a Chai ☕</title>

<script src="https://cdn.tailwindcss.com"></script>

<!-- <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script> -->

<!-- Glow Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: Inter, sans-serif;
  }

  /* Neon background blobs */
  .blob {
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.4;
    animation: float 6s infinite ease-in-out;
  }

  .blob1 { background: #22c55e; top: -80px; left: -80px; }
  .blob2 { background: #3b82f6; bottom: -80px; right: -80px; }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(20px); }
  }

  /* Glow animation */
  .glow {
    box-shadow: 0 0 20px rgba(34,197,94,0.5);
  }

  .glass {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.1);
  }

  .btn-glow:hover {
    box-shadow: 0 0 25px rgba(34,197,94,0.6);
    transform: scale(1.03);
  }
</style>
</head>

<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 overflow-hidden">

<!-- neon blobs -->
<div class="blob blob1"></div>
<div class="blob blob2"></div>

<div class="w-full max-w-lg relative z-10 p-2 rounded-3xl border border-white/20 bg-white/5">

  <!-- CARD -->
  <div class="glass rounded-2xl p-6 shadow-2xl">
    <!-- PROFILE -->
    <div class="flex flex-col sm:flex-row items-center gap-4 text-center sm:text-left">
      <div class="relative">
        <img src="https://github.com/kuntalojha.png"
             class="w-16 h-16 rounded-full border border-green-400 glow"/>
        <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-400 rounded-full animate-pulse"></span>
      </div>

      <div>
        <h1 class="text-xl font-bold">Kuntal Ojha ☕</h1>
        <p class="text-sm text-slate-300">
          Full Stack Dev • Building Open Source Magic
        </p>
      </div>
    </div>

    <!-- UPI -->
    <div class="mt-5 flex items-center justify-between glass p-3 rounded-xl">
      <span class="text-sm">UPI: <b>kuntalojha2021-1@okicici</b></span>
      <button onclick="copyUPI()"
        class="px-3 py-1 text-xs bg-white/10 hover:bg-white/20 rounded-lg">
        Copy
      </button>
    </div>

    <!-- TIERS -->
<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-5">
      <button onclick="setAmount(20)"
        class="glass btn-glow rounded-xl py-3 transition">
        ☕ ₹20
      </button>

      <button onclick="setAmount(50)"
        class="glass btn-glow rounded-xl py-3 transition">
        ☕☕ ₹50
      </button>

      <button onclick="setAmount(100)"
        class="glass btn-glow rounded-xl py-3 transition">
        ☕☕☕ ₹100
      </button>

      <button onclick="setAmount(500)"
        class="glass btn-glow rounded-xl py-3 transition">
        🔥 ₹500
      </button>

    </div>

    <!-- INPUT -->
    <input id="amount"
      type="number"
      placeholder="Enter custom amount"
      class="w-full mt-4 p-3 rounded-xl glass outline-none"/>

    <!-- PAY BUTTON -->
    <button onclick="pay()"
      class="w-full mt-4 py-3 rounded-xl font-bold bg-gradient-to-r from-green-400 to-emerald-500 text-black btn-glow transition">
      Pay via UPI 🚀
    </button>

    <!-- SUCCESS -->
    <p id="success" class="hidden text-center text-green-400 mt-3 text-sm animate-pulse">
      Payment request opened ❤️ Thank you!
    </p>

    <!-- QR -->
    <div class="mt-6 text-center">
      <p class="text-xs text-slate-400">Scan QR to pay instantly</p>
      <div class="flex justify-center mt-2">
        <img
            src="qr.jpeg"
            alt="UPI QR Code"
            class="w-40 h-40 sm:w-48 sm:h-48 mx-auto rounded-xl bg-white p-2"
        />
      </div>
    </div>

  </div>
</div>

  document.getElementById("amount").value = val;
}

  navigator.clipboard.writeText(upiID);

}

  const amount = document.getElementById("amount").value;

window.open(upiLink, "_self");

}
