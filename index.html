<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buy Me a Chai ☕</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', sans-serif;
      }

      .blob {
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 999px;
        filter: blur(100px);
        opacity: 0.35;
        animation: float 8s ease-in-out infinite;
      }

      .blob1 {
        background: #22c55e;
        top: -100px;
        left: -100px;
      }

      .blob2 {
        background: #3b82f6;
        bottom: -100px;
        right: -100px;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(30px);
        }
      }

      .glass {
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .glow {
        box-shadow: 0 0 30px rgba(34, 197, 94, 0.45);
      }

      .amount-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 0 25px rgba(34, 197, 94, 0.2);
      }

      .selected {
        border-color: #22c55e !important;
        box-shadow: 0 0 20px rgba(34, 197, 94, 0.35);
      }
    </style>
  </head>

  <body class="bg-slate-950 text-white min-h-screen overflow-x-hidden">
    <!-- BLOBS -->

    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <div
      class="container mx-auto px-4 py-8 min-h-screen flex items-center justify-center"
    >
      <div
        class="w-full max-w-2xl relative z-10 p-[3px] rounded-[32px] bg-gradient-to-r from-green-400/50 via-cyan-400/50 to-blue-500/50 shadow-[0_0_60px_rgba(34,197,94,0.15)]"
      >
        <div class="glass rounded-[30px] p-8 md:p-10 border border-white/10">
          <!-- PROFILE -->

          <div class="text-center">
            <img
              src="https://github.com/kuntalojha.png"
              alt="Kuntal Ojha"
              class="w-24 h-24 md:w-28 md:h-28 rounded-full mx-auto border-2 border-green-400 glow"
            />

            <h1 class="mt-5 text-3xl font-extrabold">Buy Me a Chai ☕</h1>

            <p class="mt-2 text-slate-400">
              Support my open-source projects and development work
            </p>
          </div>

          <!-- UPI CARD -->

          <div class="glass rounded-2xl p-4 mt-8">
            <div
              class="flex flex-col sm:flex-row gap-4 sm:items-center sm:justify-between"
            >
              <div>
                <p class="text-xs uppercase tracking-wider text-slate-500">
                  UPI ID
                </p>

                <p class="font-semibold break-all mt-1">
                  kuntalojha2021-1@okicici
                </p>
              </div>

              <button
                id="copyBtn"
                onclick="copyUPI()"
                class="px-4 py-2 rounded-xl bg-green-500/20 border border-green-500/20 hover:bg-green-500/30 transition"
              >
                Copy
              </button>
            </div>
          </div>

          <!-- QR -->

          <div class="mt-8">
            <div class="glass rounded-3xl p-6 text-center">
              <h3 class="text-xl font-bold">Scan & Support</h3>

              <p class="text-sm text-slate-400 mt-2">
                Google Pay • PhonePe • Paytm • BHIM • Any UPI App
              </p>

              <img
                src="qr.jpeg"
                alt="UPI QR"
                class="w-64 h-64 md:w-72 md:h-72 mx-auto mt-6 rounded-2xl bg-white p-3 shadow-2xl"
              />

              <div class="mt-6 text-sm text-slate-400">
                Select amount above and pay using your preferred UPI app.
              </div>
            </div>
          </div>

          <!-- FOOTER -->

          <div class="mt-8 text-center">
            <div class="text-sm">
              Made with ❤️ by Kuntal Ojha
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const upiID = 'kuntalojha2021-1@okicici';

      function copyUPI() {
        navigator.clipboard.writeText(upiID);

        const btn = document.getElementById('copyBtn');

        btn.innerText = 'Copied ✓';

        setTimeout(() => {
          btn.innerText = 'Copy';
        }, 2000);
      }

      function setAmount(amount, element) {
        document.getElementById('amount').value = amount;

        document
          .querySelectorAll('.amount-card')
          .forEach((card) => card.classList.remove('selected'));

        element.classList.add('selected');
      }
    </script>
  </body>
</html>
